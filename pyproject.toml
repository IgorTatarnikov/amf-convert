[project]
name = "amf-convert"
authors = [{name = "Advanced Microscopy Facility", email= "i.tatarnikov@ucl.ac.uk"}]
description = "A tool for converting various microscopy file formats to h5 or ome zarr"
readme = "README.md"
requires-python = ">=3.11.0"
dynamic = ["version"]

dependencies = [
    "nd2",
    "h5py",
    "numpy",
]

license = "BSD-3-Clause"

license-files = ["LICENSE"]

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

[project.urls]
"Homepage" = "https://github.com/IgorTatarnikov/amf-convert"
"Bug Tracker" = "https://github.com/IgorTatarnikov/amf-convert/issues"
"Documentation" = "https://github.com/IgorTatarnikov/amf-convert"
"Source Code" = "https://github.com/IgorTatarnikov/amf-convert"
"User Support" = "https://github.com/IgorTatarnikov/amf-convert/issues"

[project.scripts]
amf-convert = "amf_convert.cli:main"

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
  "coverage",
  "tox",
  "mypy",
  "pre-commit",
  "ruff",
  "setuptools-scm",
]

[build-system]
requires = [
    "setuptools>=77",
    "wheel",
    "setuptools-scm[toml]>=8",
]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["amf_convert*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
addopts = "--cov=amf_convert"
filterwarnings = [
    "error",
    # ponytail: nd2/dask/h5py emit DeprecationWarnings we don't control.
    # Broad ignore; narrow to specific modules if a real regression hides here.
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.setuptools_scm]

[tool.check-manifest]
ignore = [
  "*.yaml",
  "tox.ini",
  "tests/",
  "tests/test_unit/",
  "tests/test_integration/",
]

[tool.ruff]
line-length = 79
exclude = ["__init__.py", "build", ".eggs"]
lint.select = [
  "E",   # pycodestyle errors
  "F",   # Pyflakes
  "I",   # isort
  # You can see what all the rules do here: https://docs.astral.sh/ruff/rules/
  # Some additional ruff rules that might be useful (uncomment to enable)
  #"UP",  # pyupgrade
  #"B",   # flake8 bugbear
  #"SIM", # flake8 simplify
  #"C90", # McCabe complexity
]
fix = true

[tool.ruff.format]
docstring-code-format = true # Also format code in docstrings (e.g. examples)

[tool.tox]
legacy_tox_ini = """
[tox]
requires =
    tox>=4
    tox-gh-actions
envlist = py{311,312,313}
isolated_build = True

[gh-actions]
python =
    3.11: py311
    3.12: py312
    3.13: py313

[testenv]
passenv =
    CI
    GITHUB_ACTIONS
extras =
    dev
commands =
    pytest -v --color=yes --cov=amf_convert --cov-report=xml
"""


[tool.codespell]
skip = '.git'
check-hidden = true
